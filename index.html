<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Renderer-Priorität für schnelleren Start -->
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' http://localhost:* https://localhost:* ws://localhost:* wss://localhost:*; worker-src 'self' blob:; font-src 'self';"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f5f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1113"
      media="(prefers-color-scheme: dark)"
    />
    <title>Lumberjack</title>
    <!-- Critical CSS for splash screen and first paint (external to avoid unsafe-inline CSP) -->
    <link rel="stylesheet" href="src/renderer/splash.css" />
  </head>
  <body>
    <!-- Splash Screen - shown immediately while app loads -->
    <div id="splash-screen">
      <img
        src="images/lumberjack_v4_normal_1024.png"
        alt="Lumberjack"
        class="splash-logo"
      />
      <div class="splash-title">Lumberjack</div>
      <div class="splash-spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="src/main/util/main.tsx"></script>
  </body>
</html>
