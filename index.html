<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Renderer-Priorität für schnelleren Start -->
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:* https://localhost:* ws://localhost:* wss://localhost:*; worker-src 'self' blob:; font-src 'self';"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f5f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1113"
      media="(prefers-color-scheme: dark)"
    />
    <title>Lumberjack</title>
    <!-- Inline critical CSS for fastest first paint -->
    <style>
      body {
        margin: 0;
        background-color: #0f1113;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: light) {
        body {
          background-color: #f5f5f7;
        }
      }
      #app {
        min-height: 100vh;
      }

      /* Splash Screen Styles */
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f1113;
        z-index: 99999;
        transition:
          opacity 0.3s ease-out,
          visibility 0.3s ease-out;
      }
      @media (prefers-color-scheme: light) {
        #splash-screen {
          background-color: #f5f5f7;
        }
      }
      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
        animation: splash-pulse 2s ease-in-out infinite;
      }
      .splash-title {
        font-size: 24px;
        font-weight: 600;
        color: #e5e7eb;
        margin-bottom: 16px;
        letter-spacing: -0.5px;
      }
      @media (prefers-color-scheme: light) {
        .splash-title {
          color: #1f2937;
        }
      }
      .splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen - shown immediately while app loads -->
    <div id="splash-screen">
      <img
        src="images/lumberjack_v4_normal_1024.png"
        alt="Lumberjack"
        class="splash-logo"
      />
      <div class="splash-title">Lumberjack</div>
      <div class="splash-spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="src/main/util/main.tsx"></script>
  </body>
</html>
