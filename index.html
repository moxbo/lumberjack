<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Renderer-Priorität für schnelleren Start -->
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:* https://localhost:* ws://localhost:* wss://localhost:*; worker-src 'self' blob:; font-src 'self';"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f5f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1113"
      media="(prefers-color-scheme: dark)"
    />
    <title>Lumberjack</title>
    <!-- Inline critical CSS for fastest first paint -->
    <style>
      body {
        margin: 0;
        background-color: #0f1113;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      @media (prefers-color-scheme: light) {
        body {
          background-color: #f5f5f7;
        }
      }
      #app {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main/util/main.tsx"></script>
  </body>
</html>
