# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Erzeugt aus Conventional-Commit-Messages einen CHANGELOG im
# Keep-a-Changelog-Stil. Pre-Releases (-beta.N / -rc.N) erhalten einen
# eigenen Versionseintrag und werden beim nächsten Full-Release in den
# Stable-Eintrag aggregiert.

[changelog]
header = """
# Changelog

Alle nennenswerten Änderungen an diesem Projekt werden in dieser Datei dokumentiert.

Das Format orientiert sich an [Keep a Changelog](https://keepachangelog.com/de/1.1.0/),
und dieses Projekt folgt [Semantic Versioning](https://semver.org/lang/de/).\n
"""

# Tera-Template: erzeugt pro Version einen Block mit gruppierten Kategorien.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}]\
    {% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}\
    {% if version is matching("(?i)-(alpha|beta|rc)") %} _(Pre-Release)_{% endif %}
{% else -%}
    ## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first | trim }}\
{% if commit.breaking %} ⚠ BREAKING{% endif %}
{% endfor %}
{% endfor %}
"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true

# Gruppierung nach Conventional-Commit-Typ → Keep-a-Changelog-Kategorie
commit_parsers = [
  { message = "^feat",                    group = "Added" },
  { message = "^fix",                     group = "Fixed" },
  { message = "^perf",                    group = "Performance" },
  { message = "^refactor",                group = "Changed" },
  { message = "^style",                   group = "Changed" },
  { message = "^docs",                    group = "Docs" },
  { message = "^build",                   group = "Build" },
  { message = "^ci",                      group = "CI" },
  { message = "^test",                    group = "Tests" },
  { message = "^revert",                  group = "Reverted" },
  { message = "^chore\\(release\\)",      skip = true },
  { message = "^chore: bump version",     skip = true },
  { message = "^chore",                   skip = true },
  { message = ".*\\[skip[- ]ci\\]",       skip = true },
  { body = ".*security",                  group = "Security" },
]

filter_commits = false
tag_pattern = "v[0-9]*"
# Pre-Releases werden NICHT übersprungen — sie erhalten einen eigenen Eintrag.
# Beim Full-Release aggregiert `npm run release:aggregate` die Commits seit
# dem letzten Stable-Tag in einen kombinierten Block.
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

