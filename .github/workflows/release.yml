name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z.B. 1.0.16 oder 1.0.16-beta.1)"
        required: true
      prerelease:
        description: "Als Pre-Release veröffentlichen?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            PRE="${{ inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            # SemVer Pre-Release-Suffix → automatisch Pre-Release
            if [[ "$VERSION" =~ -(alpha|beta|rc|dev|next) ]]; then
              PRE="true"
            else
              PRE="false"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Detected version=$VERSION prerelease=$PRE"

  build-and-release:
    needs: detect
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-cmd: npm run release:win
            artifact-pattern: "release/build/*.exe"
          - os: macos-latest
            build-cmd: npm run release:mac
            artifact-pattern: |
              release/build/*.dmg
              release/build/*.zip
              release/build/*.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & publish to GitHub Release
        run: ${{ matrix.build-cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          EP_PRE_RELEASE: ${{ needs.detect.outputs.prerelease }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.artifact-pattern }}
          retention-days: 5

  finalize-release:
    needs: [detect, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Mark Release as prerelease (falls Beta)
        if: needs.detect.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.detect.outputs.version }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease --draft=false || true
