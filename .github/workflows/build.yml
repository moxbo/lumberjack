name: Build/release

# Läuft NICHT bei normalen Commits auf main – nur:
#   1. Push eines Versions-Tags (v*)
#   2. Manueller Start über die GitHub-UI (workflow_dispatch)
# Erfolgreiche Prüfungen desselben Commits werden vor dem Release wiederverwendet.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, Tag oder Commit, der gebaut werden soll"
        required: false
        default: main
      release_tag:
        description: "Release-Tag (z. B. v1.2.3). Wenn leer, wird bei Tag-Push automatisch übernommen."
        required: false
      prerelease:
        description: "Release als Pre-Release markieren"
        required: false
        type: boolean
        default: false
      promote_to_release:
        description: "Existierendes Pre-Release zu Release promoten (nur release_tag angeben)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Never pick up an unrelated identity from the runner's keychain.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # Ignore download counts and timestamps when comparing the tested release to the one being published.
  RELEASE_ASSET_QUERY: "{id, assets: (.assets | sort_by(.name) | map({id, name, size, state, digest}))} | @json"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      checkout_sha: ${{ steps.commit.outputs.sha }}
      promote_only: ${{ steps.meta.outputs.promote_only }}
    steps:
      - name: Parameter auswerten
        id: meta
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_PROMOTE: ${{ inputs.promote_to_release }}
        run: |
          set -euo pipefail
          event="$GITHUB_EVENT_NAME"
          ref="$GITHUB_REF"

          checkout_ref="$ref"
          should_release="false"
          release_tag=""
          prerelease="false"
          promote_only="false"

          if [[ "$event" == "workflow_dispatch" && -n "$INPUT_REF" ]]; then
            checkout_ref="$INPUT_REF"
          fi

          if [[ "$ref" == refs/tags/* ]]; then
            should_release="true"
            release_tag="${ref#refs/tags/}"
            checkout_ref="$ref"  # Use full refs/tags/... path for checkout
          elif [[ "$event" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            should_release="true"
            release_tag="$INPUT_TAG"
            # For manual dispatch, use the branch/ref (tag may not exist yet)
            if [[ -n "$INPUT_REF" ]]; then
              checkout_ref="$INPUT_REF"
            else
              checkout_ref="main"
            fi
          fi

          if [[ "$should_release" == "true" ]]; then
            if [[ "$release_tag" == *-* ]]; then
              prerelease="true"
            fi
          fi
          if [[ "$INPUT_PRERELEASE" == "true" ]]; then
            prerelease="true"
          fi

          # Check if we are promoting a pre-release to a release
          if [[ "$INPUT_PROMOTE" == "true" && -n "$INPUT_TAG" ]]; then
            should_release="true"
            release_tag="$INPUT_TAG"
            prerelease="false"  # Force to non-prerelease
            promote_only="true"  # Skip build, only update release
            checkout_ref="refs/tags/$INPUT_TAG"
          fi

          if [[ "$should_release" == "true" && ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported release tag; expected vX.Y.Z or vX.Y.Z-{alpha,beta,rc}.N"
            exit 1
          fi

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "promote_only=$promote_only" >> "$GITHUB_OUTPUT"

      - name: Checkout for release creation
        if: ${{ steps.meta.outputs.should_release == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Update version in package.json and commit (workflow_dispatch only)
        # Bei Tag-Push hat scripts/release.sh Version-Bump, Commit und Tag bereits
        # erledigt (der Tag ist die Quelle der Wahrheit). Dieser Schritt bumpt daher
        # nur beim manuellen workflow_dispatch, wo Tag/Version noch nicht existieren.
        if: ${{ steps.meta.outputs.should_release == 'true' && steps.meta.outputs.promote_only != 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.release_tag }}"
          version="${tag#v}"  # Entferne v-Präfix (v1.0.7 -> 1.0.7)

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; its commit will be validated and released unchanged"
            exit 0
          fi

          # Prüfe ob Version bereits aktuell ist
          current_version=$(node -p "require('./package.json').version")
          if [[ "$current_version" == "$version" ]]; then
            echo "Version $version is already set in package.json, skipping update"
            exit 0
          fi

          # Aktualisiere Version in package.json
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "Updated package.json to version $version"

          # Preserve the selected source branch; detached refs are published via the tag.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $version [skip ci]"
          if branch=$(git symbolic-ref --quiet --short HEAD); then
            git push origin "HEAD:refs/heads/$branch"
            echo "Committed and pushed version $version to $branch"
          else
            echo "Committed version $version on a detached ref; the release tag will publish it"
          fi

      - name: Create tag and draft GitHub Release (once)
        if: ${{ steps.meta.outputs.should_release == 'true' && steps.meta.outputs.promote_only != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.release_tag }}"
          # Create tag if it doesn't exist (for workflow_dispatch)
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Creating tag $tag..."
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

          # Create draft release if it doesn't exist
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Refusing to replace assets on an already published release"
              exit 1
            fi
          else
            gh release create "$tag" --draft --title "$tag" --notes "Release $tag"
          fi

      - name: Resolve release commit
        id: commit
        if: ${{ steps.meta.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          PROMOTE_ONLY: ${{ steps.meta.outputs.promote_only }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$PROMOTE_ONLY" == "true" ]]; then
            gh release view "$RELEASE_TAG" >/dev/null
          fi
          echo "Release $RELEASE_TAG resolves to $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  existing-checks:
    name: Reuse existing checks
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      ci_reused: ${{ steps.checks.outputs.ci_reused }}
      integration_reused: ${{ steps.checks.outputs.integration_reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Older release tags may not contain the current validation helper.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Discover and wait for exact-commit checks
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.checkout_sha }}
        run: node scripts/release-checks.mjs

  ci:
    name: Release CI
    needs: [prepare-release, existing-checks]
    if: ${{ needs.existing-checks.outputs.ci_reused == 'false' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare-release.outputs.checkout_sha }}
    permissions:
      contents: read

  integration:
    name: Release integration tests
    needs: [prepare-release, existing-checks]
    if: ${{ needs.existing-checks.outputs.integration_reused == 'false' }}
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ needs.prepare-release.outputs.checkout_sha }}
    permissions:
      contents: read

  validation:
    name: Required release checks
    needs: [prepare-release, existing-checks, ci, integration]
    if: >-
      ${{
        !cancelled() &&
        needs.prepare-release.result == 'success' &&
        needs.prepare-release.outputs.should_release == 'true'
      }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require reused or fresh successful checks
        env:
          EXISTING_RESULT: ${{ needs.existing-checks.result }}
          CI_REUSED: ${{ needs.existing-checks.outputs.ci_reused }}
          CI_RESULT: ${{ needs.ci.result }}
          INTEGRATION_REUSED: ${{ needs.existing-checks.outputs.integration_reused }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          if [[ "$EXISTING_RESULT" != "success" ]]; then
            echo "::error::Existing-check discovery did not succeed"
            exit 1
          fi
          require_check() {
            case "$2:$3" in
              true:skipped|false:success) echo "$1 checks passed" ;;
              *) echo "::error::$1 checks did not succeed (reused=$2, result=$3)"; exit 1 ;;
            esac
          }
          require_check CI "$CI_REUSED" "$CI_RESULT"
          require_check Integration "$INTEGRATION_REUSED" "$INTEGRATION_RESULT"

  # Voller Build & Release: Nur bei Tags oder manuellem Release
  release:
    needs: [prepare-release, validation]
    if: >-
      ${{
        !cancelled() &&
        needs.validation.result == 'success' &&
        needs.prepare-release.result == 'success' &&
        needs.prepare-release.outputs.should_release == 'true' &&
        needs.prepare-release.outputs.promote_only != 'true'
      }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: win
          - os: macos-latest
            arch: arm64
            platform: mac
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_sha }}
          fetch-depth: 0
          fetch-tags: true

      # A manually selected older tag need not contain the current release helpers.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (with retry)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            npm ci && exit 0
            if [[ "$i" == 3 ]]; then exit 1; fi
            echo "Attempt $i failed, retrying in 15 seconds..."
            sleep 15
            npm cache clean --force
          done
        timeout-minutes: 15

      - name: Build application
        shell: bash
        run: |
          echo "RELEASE_VERSION=$RELEASE_VERSION"
          # Aktualisiere Version in Haupt-package.json (ohne Git-Commit)
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="${RELEASE_VERSION#v}"  # Entferne v-Präfix
            npm version "$version" --no-git-tag-version --allow-same-version
            echo "Updated root package.json to version $version"
          fi
          npm run build
          echo "Built version: $(node -p "require('./release/app/package.json').version")"
        env:
          CI: true
          # Version wird aus dem Release-Tag übernommen (z.B. v1.0.7 -> 1.0.7)
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Build Windows NSIS and portable from one application bundle
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          CI: true
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          REQUIRE_SIGNATURE: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          $options = @()
          if ($env:WIN_CSC_LINK) {
            $options += '-c.win.forceCodeSigning=true'
          } elseif ($env:REQUIRE_SIGNATURE -eq 'true' -or $env:WIN_CSC_KEY_PASSWORD) {
            throw 'Windows signing requested but WIN_CSC_LINK is missing'
          }
          npx --no-install electron-builder --win nsis portable --x64 --publish never @options

      - name: Create Windows ZIP without installer update metadata
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./.release-tools/scripts/create-windows-zip.ps1 -UnpackedDir release/build/win-unpacked -ZipPath "release/build/Lumberjack-$version-x64-win.zip"

      - name: Build macOS app bundle
        if: ${{ matrix.platform == 'mac' }}
        run: npx electron-builder --mac dir --${{ matrix.arch }} --publish never
        env:
          CI: true
          # Kein Code-Signing/Notarization (keine Apple-Zertifikate vorhanden).
          # Ad-hoc-Signatur wird im nächsten Schritt angewendet.

      - name: Ad-hoc sign macOS app (if not already signed)
        if: ${{ matrix.platform == 'mac' }}
        shell: bash
        run: |
          # Find the .app bundle in the build output
          app_path=$(find release/build -name "*.app" -type d | head -1)
          if [[ -n "$app_path" ]]; then
            echo "Checking signature of $app_path..."
            # Check if already signed with a valid identity
            if ! codesign -v "$app_path" 2>/dev/null; then
              echo "App is not signed or signature is invalid. Applying ad-hoc signature..."
              codesign --force --deep --sign - "$app_path"
              echo "Ad-hoc signature applied successfully"
              codesign -v "$app_path" && echo "Signature verification passed"
            else
              echo "App is already properly signed"
            fi
          else
            echo "No .app bundle found, skipping ad-hoc signing"
          fi

      - name: Build macOS DMG and ZIP from signed app
        if: ${{ matrix.platform == 'mac' }}
        shell: bash
        run: |
          # --prepackaged muss auf die .app zeigen, nicht auf den Ordner
          app_path="release/build/mac-${{ matrix.arch }}/Lumberjack.app"
          echo "Creating DMG/ZIP from $app_path"
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --prepackaged "$app_path"
        env:
          CI: true

      - name: Verify and stage only expected release assets
        shell: bash
        run: node .release-tools/scripts/release-assets.mjs stage release/build "$RELEASE_TAG" "${{ matrix.platform }}"

      - name: Archive verified build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform == 'win' && 'windows' || 'macos' }}-release-${{ matrix.arch }}
          path: release/build/publish-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified assets to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/build/publish-${{ matrix.platform }}/* --clobber

  installer-smoke:
    name: Verify release assets and installed Windows upgrade
    needs: [prepare-release, validation, release]
    outputs:
      asset_fingerprint: ${{ steps.installers.outputs.asset_fingerprint }}
    if: >-
      ${{
        !cancelled() &&
        needs.prepare-release.result == 'success' &&
        needs.validation.result == 'success' &&
        needs.prepare-release.outputs.should_release == 'true' &&
        (
          needs.release.result == 'success' ||
          (needs.prepare-release.outputs.promote_only == 'true' && needs.release.result == 'skipped')
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 15
    # GitHub requires push access to read drafts. Only the download step gets
    # GH_TOKEN; never pass it to the installer or persist it in the checkout.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Playwright launches the installed EXE, not the npm Electron binary.
      - run: npm ci --ignore-scripts
      - name: Download and verify published predecessor and release candidate
        id: installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-assets.mjs fetch-installers "$env:RUNNER_TEMP/installers" "$env:RELEASE_TAG"
      - name: Install, upgrade, launch and uninstall
        shell: pwsh
        env:
          PREVIOUS_TAG: ${{ steps.installers.outputs.previous }}
          REQUIRE_SIGNATURE: ${{ secrets.WIN_CSC_LINK != '' || vars.WINDOWS_SIGNING_REQUIRED == 'true' }}
        run: |
          ./scripts/smoke-nsis.ps1 -Installers "$env:RUNNER_TEMP/installers" -PreviousTag $env:PREVIOUS_TAG -ReleaseTag $env:RELEASE_TAG -RequireSignature:($env:REQUIRE_SIGNATURE -eq 'true')

  finalize-release:
    needs: [prepare-release, installer-smoke]
    if: ${{ !cancelled() && needs.installer-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_sha }}
          fetch-depth: 0
          fetch-tags: true # Fetch all tags for changelog generation

      - name: Generate Changelog and Finalize Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          TESTED_ASSETS: ${{ needs.installer-smoke.outputs.asset_fingerprint }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"

          REPO="${{ github.repository }}"
          REPO_URL="https://github.com/$REPO"

          # Find previous release tag.
          # - Stable release (no '-'): compare against the last STABLE tag, so
          #   Full-Release notes aggregate ALL commits since the last stable
          #   (including everything that was in any beta/rc plus commits that
          #   were never shipped in a pre-release).
          # - Pre-release (-beta.N / -rc.N): compare against the previous tag
          #   of ANY kind (incremental notes between betas).
          if [[ "$tag" == *-* ]]; then
            previous_tag=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -v "^$tag$" | head -n 1 || echo "")
          else
            previous_tag=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$tag$" | head -n 1 || echo "")
          fi

          echo "Current tag: $tag"
          echo "Previous tag: $previous_tag"

          # Function to format commits with PR/issue links
          format_commits() {
            local commits="$1"
            local formatted=""
            while IFS= read -r line; do
              if [[ -z "$line" ]]; then continue; fi
              # Extract PR number if present (e.g., "(#123)" or "PR #123")
              if [[ "$line" =~ \#([0-9]+) ]]; then
                pr_num="${BASH_REMATCH[1]}"
                # Format as linked item
                commit_msg=$(echo "$line" | sed -E 's/- //' | sed -E 's/\(#[0-9]+\)//' | sed -E 's/\([a-f0-9]+$//' | xargs)
                formatted+="- $commit_msg [#$pr_num]($REPO_URL/issues/$pr_num)\n"
              else
                # Format without PR link, but with commit hash link
                if [[ "$line" =~ \(([a-f0-9]+)\)$ ]]; then
                  hash="${BASH_REMATCH[1]}"
                  commit_msg=$(echo "$line" | sed -E 's/- //' | sed -E 's/\([a-f0-9]+\)$//' | xargs)
                  formatted+="- $commit_msg [\`$hash\`]($REPO_URL/commit/$hash)\n"
                else
                  formatted+="$line\n"
                fi
              fi
            done <<< "$commits"
            echo -e "$formatted"
          }

          # Generate changelog
          changelog=""

          if [[ -n "$previous_tag" ]]; then
            echo "Generating changelog from $previous_tag to $tag"
            
            # Get commits between tags, grouped by type
            # Exclude version bump commits (chore: bump version) from all categories
            features=$(git log "$previous_tag..$tag" --pretty=format:"- %s (%h)" --grep="^feat" --regexp-ignore-case 2>/dev/null || echo "")
            fixes=$(git log "$previous_tag..$tag" --pretty=format:"- %s (%h)" --grep="^fix" --regexp-ignore-case 2>/dev/null || echo "")
            docs=$(git log "$previous_tag..$tag" --pretty=format:"- %s (%h)" --grep="^docs" --regexp-ignore-case 2>/dev/null || echo "")
            refactor=$(git log "$previous_tag..$tag" --pretty=format:"- %s (%h)" --grep="^refactor" --regexp-ignore-case 2>/dev/null || echo "")
            perf=$(git log "$previous_tag..$tag" --pretty=format:"- %s (%h)" --grep="^perf" --regexp-ignore-case 2>/dev/null || echo "")
            deps=$(git log "$previous_tag..$tag" --pretty=format:"- %s (%h)" --grep="^deps\|^chore.*dep\|upgrade" --regexp-ignore-case 2>/dev/null | grep -vi "bump version" || echo "")
            chore=$(git log "$previous_tag..$tag" --pretty=format:"- %s (%h)" --grep="^chore" --regexp-ignore-case 2>/dev/null | grep -vi "dep\|upgrade\|bump version" || echo "")
            build=$(git log "$previous_tag..$tag" --pretty=format:"- %s (%h)" --grep="^build\|^ci" --regexp-ignore-case 2>/dev/null || echo "")
            
            # Build changelog with sections (Spring Framework style)
            changelog=":sparkles: **What's Changed**\n\n"
            changelog+="See [$tag Release Notes]($REPO_URL/releases/tag/$tag) for details.\n\n"
            
            if [[ -n "$features" ]]; then
              changelog+="## :rocket: New Features\n$(format_commits "$features")\n"
            fi
            
            if [[ -n "$fixes" ]]; then
              changelog+="## :lady_beetle: Bug Fixes\n$(format_commits "$fixes")\n"
            fi
            
            if [[ -n "$perf" ]]; then
              changelog+="## :zap: Performance Improvements\n$(format_commits "$perf")\n"
            fi
            
            if [[ -n "$refactor" ]]; then
              changelog+="## :recycle: Refactoring\n$(format_commits "$refactor")\n"
            fi
            
            if [[ -n "$docs" ]]; then
              changelog+="## :notebook_with_decorative_cover: Documentation\n$(format_commits "$docs")\n"
            fi
            
            if [[ -n "$deps" ]]; then
              changelog+="## :hammer: Dependency Upgrades\n$(format_commits "$deps")\n"
            fi
            
            if [[ -n "$build" ]]; then
              changelog+="## :wrench: Build & CI\n$(format_commits "$build")\n"
            fi
            
            if [[ -n "$chore" ]]; then
              changelog+="## :broom: Maintenance\n$(format_commits "$chore")\n"
            fi
            
            # Add comparison link
            changelog+="\n---\n**Full Changelog**: [$previous_tag...$tag]($REPO_URL/compare/$previous_tag...$tag)"
          else
            echo "No previous tag found, using GitHub's auto-generated notes"
            # Fallback to GitHub's generated notes for first release
            changelog=$(gh api repos/$REPO/releases/generate-notes -f tag_name="$tag" --jq '.body' 2>/dev/null || echo ":tada: Initial Release")
          fi

          # A draft can be edited while Windows is running the smoke test.
          snapshot=$(gh release view "$tag" --json id,assets --jq "$RELEASE_ASSET_QUERY")
          actual=$(printf '%s' "$snapshot" | sha256sum | cut -d ' ' -f 1)
          if [[ "$actual" != "$TESTED_ASSETS" ]]; then
            echo "::error::The tested release assets have changed. Re-run the installer check before publication."
            exit 1
          fi
          echo -e "$changelog" | gh release edit "$tag" --title "$tag" --notes-file - --prerelease="$PRERELEASE" --draft=false

          echo "✅ Release $tag finalized successfully!"
